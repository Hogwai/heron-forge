# Heron Forge build configuration
# All versions are declared here, never hard-coded in module build scripts.

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Do not auto-download toolchains; the environment must provide JDK 25.
org.gradle.java.installations.auto-download=false

# ---------------------------------------------------------------------------
# Toolchain
# ---------------------------------------------------------------------------
javaToolchainVersion=25

# ---------------------------------------------------------------------------
# Build tooling versions
# ---------------------------------------------------------------------------
gradleVersion=9.7.0

# ---------------------------------------------------------------------------
# Dependency versions
# ---------------------------------------------------------------------------
junitJupiterVersion=5.11.4
assertjVersion=3.27.7
archunitVersion=1.4.2
jdbiVersion=3.54.0
jacksonVersion=2.21.1
snakeyamlEngineVersion=3.1.1
slf4jVersion=2.0.16
helidonVersion=4.5.3
postgresqlVersion=42.7.7
hikariVersion=7.1.0
revapiVersion=0.19.1
jmhVersion=1.37
picocliVersion=4.7.7

# ---------------------------------------------------------------------------
# Plugin versions
# ---------------------------------------------------------------------------
jmhPluginVersion=0.7.3
errorpronePluginVersion=5.1.0
revapiPluginVersion=1.8.0
kotlinPluginVersion=2.4.10

# ---------------------------------------------------------------------------
# Revapi baseline
# ---------------------------------------------------------------------------
# Previous version of heron-platform-spi used as the API baseline.
# The POC publishes this version to Maven Local instead of a public repository.
platformSpiBaselineVersion=0.1.0

# ---------------------------------------------------------------------------
# Quality gate tool versions
# ---------------------------------------------------------------------------
errorproneVersion=2.50.0
pmdVersion=7.25.0
checkstyleVersion=13.6.0
jacocoVersion=0.8.15

apiVersion: platform.dev/v1alpha1
kind: Application
metadata:
  name: factory-demo
spec:
  capabilities:
    - id: orders
      type: source
      provider:
        id: acme
        version: 1.2.3
      config:
        host: localhost
        port: 8080
        retries: 3
        tags: [a, b]
    - id: enrich
      type: transform
      provider:
        id: acme
        version: 1.2.3
      inputs:
        in:
          capability: orders
          port: out

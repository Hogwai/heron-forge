apiVersion: heron.dev/v1
application: supply-chain-demo
capabilities:
  - id: orders
    provider:
      id: demo.orders
      version: 1.0.0
    config:
      url: ${HERON_DB_URL}
      user: ${HERON_DB_USER}
      password: ${HERON_DB_PASSWORD}
      maxRows: 5000
      maxBytes: 5000000
  - id: deliveries
    provider:
      id: demo.deliveries
      version: 1.0.0
    config:
      url: ${HERON_DB_URL}
      user: ${HERON_DB_USER}
      password: ${HERON_DB_PASSWORD}
      maxRows: 5000
      maxBytes: 5000000
  - id: kotlin-order-summary
    provider:
      id: demo.kotlin.order-summary
      version: 1.0.0
    config:
      url: ${HERON_DB_URL}
      user: ${HERON_DB_USER}
      password: ${HERON_DB_PASSWORD}
      maxRows: 5000
      maxBytes: 5000000
  - id: exception-detector
    provider:
      id: supply-chain.exception-detector
      version: 1.0.0
    config:
      lateToleranceDays: 1
      minimumDeliveryRatio: 0.8
      priorityRiskDays: 3
    inputs:
      orders:
        capability: orders
        port: records
      deliveries:
        capability: deliveries
        port: records
endpoints:
  - id: supply-chain-exceptions
    method: GET
    path: /exceptions
    target: exception-detector
  - id: kotlin-order-summary
    method: GET
    path: /kotlin-order-summary
    target: kotlin-order-summary
